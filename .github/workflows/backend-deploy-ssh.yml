name: Deploy Backend to SSH Server

on:
  push:
    branches:
      - main
      - brand/OHIS
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - '.github/workflows/backend-deploy-ssh.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/konstantinrogozhkin/neira-webui/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Deploy to SSH Server
        run: |
          # Install SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add server to known_hosts
          ssh-keyscan -H 37.27.192.51 >> ~/.ssh/known_hosts
          
          # Deploy to server
          echo "🚀 Deploying to SSH server..."
          
          # Pull latest image and restart container
          ssh root@37.27.192.51 << 'EOF'
            # Pull latest image (use brand-OHIS tag)
            docker pull ghcr.io/konstantinrogozhkin/neira-webui/backend:brand-OHIS
            
            # Stop existing container if running
            docker stop neira-webui-backend || true
            docker rm neira-webui-backend || true
            
            # Run new container
            docker run -d \
              --name neira-webui-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              -e NODE_ENV=production \
              -e PORT=8000 \
              ghcr.io/konstantinrogozhkin/neira-webui/backend:brand-OHIS
              
            # Show container status
            echo "📊 Container status:"
            docker ps | grep neira-webui-backend
            
            # Show logs
            echo "📝 Recent logs:"
            docker logs --tail 10 neira-webui-backend
          EOF
          
          echo "✅ Deployment completed!"
