name: Deploy Backend to RunPod

on:
  push:
    branches:
      - main
      - brand/OHIS
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - 'docker-compose.yml'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Deploy to RunPod
        run: |
          # Install RunPod CLI using official method
          wget --quiet --show-progress https://github.com/Run-Pod/runpodctl/releases/download/v1.14.3/runpodctl-linux-amd64 -O runpodctl
          chmod +x runpodctl
          sudo cp runpodctl /usr/bin/runpodctl
          
          # Verify installation
          runpodctl version
          
          # Check available commands
          runpodctl --help
          
          # Configure RunPod CLI with API key
          runpodctl config --apiKey "${{ secrets.RUNPOD_API_KEY }}"
          
          # Check create pod command specifically
          runpodctl create pod --help
          
          # Deploy to RunPod using correct command syntax
          runpodctl create pod \
            --name "neira-webui-backend-$(date +%s)" \
            --image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:brand-OHIS" \
            --gpu-type "NONE" \
            --cpu 2 \
            --memory 4 \
            --disk 10 \
            --ports "8000:8000" \
            --env "NODE_ENV=production" \
            --env "PORT=8000"
