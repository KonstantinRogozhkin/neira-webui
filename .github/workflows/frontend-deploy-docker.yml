name: Build Frontend and Deploy to Docker

on:
  push:
    branches:
      - main
      - brand/OHIS
    paths:
      - 'src/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - 'svelte.config.js'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'tsconfig.json'
      - '.github/workflows/frontend-deploy-docker.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build Frontend and Deploy to Docker
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build frontend
        run: npm run build
        
      - name: Create Docker image for frontend
        run: |
          # Create Dockerfile for frontend
          cat > Dockerfile.frontend << 'EOF'
          FROM nginx:alpine
          
          # Copy built frontend files
          COPY build/ /usr/share/nginx/html/
          
          # Copy custom nginx config
          COPY nginx.conf /etc/nginx/nginx.conf
          
          # Expose port
          EXPOSE 80
          
          # Health check
          HEALTHCHECK --interval=30s --timeout=10s --start-period=5s --retries=3 \
            CMD ["wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/", "||", "exit", "1"]
          
          # Start nginx
          CMD ["nginx", "-g", "daemon off;"]
          EOF
          
          # Create nginx config
          cat > nginx.conf << 'EOF'
          events {
              worker_connections 1024;
          }
          
          http {
            include       /etc/nginx/mime.types;
            default_type  application/octet-stream;
            
            # Gzip compression
            gzip on;
            gzip_vary on;
            gzip_min_length 1024;
            gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
            
            # Upgrade mapping for WebSocket/SSE
            map $http_upgrade $connection_upgrade {
                default upgrade;
                ''      close;
            }
            
            # Logging
            access_log /var/log/nginx/access.log;
            error_log /var/log/nginx/error.log;
            
            server {
              listen 80;
              server_name localhost;
              root /usr/share/nginx/html;
              index index.html;
              
              # Handle SPA routing
              location / {
                try_files $uri $uri/ /index.html;
              }
              
              # Proxy API to backend container over Docker network
              location /api/ {
                  proxy_pass http://neira-webui-backend:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_buffering off;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }

              # Proxy OpenAI-compatible routes if served via backend
              location /openai/ {
                  proxy_pass http://neira-webui-backend:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_buffering off;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }

              # Proxy Ollama-compatible routes if served via backend
              location /ollama/ {
                  proxy_pass http://neira-webui-backend:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection $connection_upgrade;
                  proxy_buffering off;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }
              
              # Cache static assets
              location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
              }
              
              # Security headers
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              add_header X-XSS-Protection "1; mode=block" always;
              add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            }
          }
          EOF
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/konstantinrogozhkin/neira-webui/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Deploy to SSH Server
        run: |
          # Install SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add server to known_hosts
          ssh-keyscan -H 37.27.192.51 >> ~/.ssh/known_hosts
          
          # Deploy to server in a single SSH session
          echo "🚀 Deploying frontend to SSH server..."
          ssh root@37.27.192.51 << 'EOF'
          set -e

          echo "🧹 Cleaning up Docker to free space..."
          docker system prune -f || true
          docker image prune -f || true

          echo "📥 Pulling frontend Docker image..."
          docker pull ghcr.io/konstantinrogozhkin/neira-webui/frontend:brand-OHIS

          echo "🛑 Stopping existing frontend container..."
          docker stop neira-webui-frontend || true
          docker rm neira-webui-frontend || true

          echo "🌐 Ensuring Docker network exists..."
          if ! docker network inspect neira-network >/dev/null 2>&1; then
            docker network create neira-network
          fi

          echo "🚀 Starting new frontend container..."
          docker run -d \
            --name neira-webui-frontend \
            --restart unless-stopped \
            -p 80:80 \
            --network neira-network \
            ghcr.io/konstantinrogozhkin/neira-webui/frontend:brand-OHIS

          echo "📊 Frontend container status:"
          docker ps | grep neira-webui-frontend || true

          echo "📝 Frontend container logs:"
          docker logs --tail 10 neira-webui-frontend || true
          EOF
          
          echo "✅ Frontend deployment completed!"
