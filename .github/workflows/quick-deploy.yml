name: Quick Deploy Test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'brand/OHIS'
        type: choice
        options:
          - main
          - brand/OHIS
          - develop

jobs:
  quick-deploy:
    runs-on: ubuntu-latest
    name: Quick Deploy Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: src/package-lock.json
          
      - name: Install dependencies
        run: |
          cd src
          npm ci
          
      - name: Build frontend
        run: |
          cd src
          npm run build
          
      - name: Show build result
        run: |
          echo "✅ Build completed successfully!"
          echo "📁 Build output:"
          ls -la src/build/
          
      - name: Deploy to Vercel (if secrets configured)
        if: secrets.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_OHIS_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'
          
      - name: Skip Vercel deploy (no secrets)
        if: secrets.VERCEL_TOKEN == ''
        run: |
          echo "⚠️ Vercel secrets not configured"
          echo "📋 Please follow VERCEL_SETUP.md to configure deployment"
          echo "🔑 Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_*_PROJECT_ID"
