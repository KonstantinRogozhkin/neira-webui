name: Simple Deploy to Vercel
# Updated: Added VERCEL_PROJECT_ID flag for proper deployment

on:
  push:
    branches:
      - main
      - brand/OHIS
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Vercel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Cache SvelteKit build
        uses: actions/cache@v4
        with:
          path: |
            .svelte-kit
            build
          key: ${{ runner.os }}-sveltekit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-sveltekit-
            
      - name: Cache Vercel CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-vercel-cli-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vercel-cli-
          
      - name: Install dependencies
        run: |
          npm ci
          
      - name: Build frontend
        run: |
          npm run build
          
      - name: Install Vercel CLI
        run: |
          if ! command -v vercel &> /dev/null; then
            npm install --global vercel@latest
          else
            echo "Vercel CLI already installed"
          fi
          
      - name: Deploy to Vercel
        run: |
          vercel --token ${{ secrets.VERCEL_TOKEN }} \
                 --prod \
                 --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
