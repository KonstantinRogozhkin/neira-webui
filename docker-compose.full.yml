version: '3.8'

services:
  frontend:
    image: ghcr.io/konstantinrogozhkin/neira-webui/frontend:brand-OHIS
    ports:
      - "80:80"
    networks:
      - neira-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - backend

  backend:
    image: ghcr.io/konstantinrogozhkin/neira-webui/backend:brand-OHIS
    ports:
      - "8000:8000"
    networks:
      - neira-network
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=8000
    volumes:
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  neira-network:
    driver: bridge
